name: Daily Commit

on:
  schedule:
    # Runs at 12:00 PM UTC every day (adjust hour as needed)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          date -u > log.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "calebsze"
          git config --global user.email "calebszekailok@gmail.com"
          git add log.txt
          git commit -m "chore: automated daily update [skip ci]" || exit 0
          git push
